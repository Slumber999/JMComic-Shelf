[package]
name = "jmcomic-shelf"
# 与 tauri.conf.json 的 version 保持一致，否则 exe 的文件属性会显示成旧版本
version = "1.0.7"
description = "禁漫书架 (JMComic Shelf) - 禁漫天堂下载与本地书库客户端"
authors = ["Slumber999"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "jmcomic_shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = { version = "2" }
tauri-plugin-dialog = { version = "2" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
yaserde = { version = "0.12.0", features = ["yaserde_derive"] }

specta = { version = "2.0.0-rc", features = ["serde_json"] }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta-typescript = { version = "0.0.7" }

reqwest = { version = "0.12.15", features = ["json", "cookies"] }
reqwest-retry = { version = "0.6.1" }
reqwest-middleware = { version = "0.3.3 " }

base64 = { version = "0.22" }
md5 = { version = "0.7.0" }
aes = { version = "0.8.4" }

eyre = { version = "0.6.12" }
tokio = { version = "1.40.0", features = ["full"] }
bytes = { version = "1.7.2" }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { git = "https://github.com/lanyeeee/lopdf", features = ["embed_image_jpeg", "embed_image_png", "embed_image_webp"] }
flate2 = { version = "1.0.34" }
parking_lot = { version = "0.12.3", features = ["send_guard"] }
rayon = { version = "1.10.0" }
uuid = { version = "1.15.1", features = ["v4"] }
zip = { version = "2.2.3", default-features = false, features = ["deflate-flate2", "flate2"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["json", "time", "local-time"] }
tracing-appender = { version = "0.2.3" }
tracing-error = { version = "0.2.1" }
notify = { version = "8.0.0" }
strfmt = { version = "0.2.4" }
walkdir = { version = "2.5.0" }
indexmap = { version = "2.10.0" }

# 开发构建的体积控制：
# 默认 debug=true 时 target/debug 能涨到 20 GB+（依赖的调试信息占大头）。
# 依赖完全不带调试信息；自己的 crate 只保留行号级调试信息，panic 堆栈仍能看到 文件:行。
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
